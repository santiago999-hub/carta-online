<div class="productos-container">
  <div class="toolbar">
    <div class="toolbar-header">
      <mat-icon class="toolbar-icon">inventory_2</mat-icon>
      <h2>Gestión de Productos</h2>
    </div>
    <div class="actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filtrar por empresa</mat-label>
        <mat-select [(ngModel)]="selectedCompanyId" (selectionChange)="onCompanyChange()">
          <mat-option [value]="null">Todas las empresas</mat-option>
          <mat-option *ngFor="let e of empresas" [value]="e.id">{{e.name}}</mat-option>
        </mat-select>
        <mat-icon matPrefix>business</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar productos</mat-label>
        <input matInput [(ngModel)]="filter" (ngModelChange)="load()" placeholder="Nombre o descripción" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="openDialog()" class="add-btn">
        <mat-icon>add_shopping_cart</mat-icon>
        Nuevo Producto
      </button>
    </div>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>Id</th><td mat-cell *matCellDef="let p">{{p.id}}</td></ng-container>
    <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Nombre</th><td mat-cell *matCellDef="let p">{{p.name}}</td></ng-container>
    <ng-container matColumnDef="price"><th mat-header-cell *matHeaderCellDef>Precio</th><td mat-cell *matCellDef="let p">{{p.price | currency:'ARS'}}</td></ng-container>
    <ng-container matColumnDef="category"><th mat-header-cell *matHeaderCellDef>Categoria</th><td mat-cell *matCellDef="let p">{{getNombreCategoria(p.categoryId)}}</td></ng-container>
    <ng-container matColumnDef="company"><th mat-header-cell *matHeaderCellDef>Empresa</th><td mat-cell *matCellDef="let p">{{getNombreEmpresa(p.companyId)}}</td></ng-container>
    <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Acciones</th><td mat-cell *matCellDef="let p" class="actions-cell">
      <button mat-mini-fab color="primary" (click)="openDialog(p)" matTooltip="Editar producto" class="action-btn">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-mini-fab color="warn" (click)="delete(p.id)" matTooltip="Eliminar producto" class="action-btn">
        <mat-icon>delete</mat-icon>
      </button>
    </td></ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
