<div class="categorias-container">
  <div class="toolbar">
    <div class="toolbar-header">
      <mat-icon class="toolbar-icon">category</mat-icon>
      <h2>Gestión de Categorías</h2>
    </div>
    <div class="actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filtrar por empresa</mat-label>
        <mat-select [(ngModel)]="selectedCompanyId" (selectionChange)="onCompanyChange()">
          <mat-option [value]="null">Todas las empresas</mat-option>
          <mat-option *ngFor="let e of empresas" [value]="e.id">{{e.name}}</mat-option>
        </mat-select>
        <mat-icon matPrefix>business</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar categorías</mat-label>
        <input matInput [(ngModel)]="filter" (ngModelChange)="load()" placeholder="Nombre" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="openDialog()" class="add-btn">
        <mat-icon>add_circle</mat-icon>
        Nueva Categoría
      </button>
    </div>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let c">{{c.id}}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let c">{{c.name}}</td>
    </ng-container>
    <ng-container matColumnDef="company">
      <th mat-header-cell *matHeaderCellDef>Empresa</th>
      <td mat-cell *matCellDef="let c">{{getNombreEmpresa(c.companyId)}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let c" class="actions-cell">
        <button mat-mini-fab color="primary" (click)="openDialog(c)" matTooltip="Editar categoría" class="action-btn">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-mini-fab color="warn" (click)="delete(c.id)" matTooltip="Eliminar categoría" class="action-btn">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
